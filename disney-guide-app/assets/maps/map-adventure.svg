<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" font-family="'Inter','Work Sans',Arial,sans-serif">
  <defs>
    <style>
      .land { stroke: #1a2744; stroke-width: 1.5; stroke-dasharray: 3 5; }
      .land-label { font-size: 12px; fill: #6b7280; letter-spacing: 1px; text-transform: uppercase; }
      .route { stroke: #c9a227; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; fill: none; }
      .poi-dot { fill: #1a2744; stroke: #f7f1e3; stroke-width: 2; }
      .poi-label { font-size: 12.5px; fill: #1a2744; font-weight: 600; }
      .poi-num { font-size: 11px; fill: #fff; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
  <rect width="620" height="620" fill="#f4ede0"/>

  <!-- Zones -->
  <ellipse class="land" cx="210" cy="180" rx="170" ry="140" fill="#dbeaf5"/>
  <text class="land-label" x="210" y="55" text-anchor="middle">World of Frozen</text>

  <ellipse class="land" cx="440" cy="230" rx="150" ry="150" fill="#e7dcee"/>
  <text class="land-label" x="440" y="95" text-anchor="middle">Avengers Campus</text>

  <ellipse class="land" cx="300" cy="470" rx="230" ry="120" fill="#e6ded0"/>
  <text class="land-label" x="300" y="365" text-anchor="middle">Pixar Place &amp; Cars Road Trip</text>

  <!-- Llac -->
  <ellipse cx="300" cy="300" rx="60" ry="34" fill="#a8c5d6" opacity="0.7"/>
  <text x="300" y="304" text-anchor="middle" font-size="11" fill="#2a5570">Llac</text>

  <!-- Route: matí dilluns -->
  <path class="route" d="M180 130 L 210 200 L 230 260 L 280 330 L 260 420 L 200 480"/>

  <!-- POIs -->
  <g>
    <circle class="poi-dot" cx="180" cy="130" r="12" fill="#2a6f97"/><text class="poi-num" x="180" y="134">1</text>
    <text class="poi-label" x="198" y="134">Frozen Ever After</text>
  </g>
  <g>
    <circle class="poi-dot" cx="230" cy="260" r="11"/><text class="poi-num" x="230" y="264">2</text>
    <text class="poi-label" x="90" y="245">World of Frozen (passeig)</text>
  </g>
  <g>
    <circle class="poi-dot" cx="280" cy="330" r="11"/><text class="poi-num" x="280" y="334">3</text>
    <text class="poi-label" x="296" y="322">Ratatouille</text>
  </g>
  <g>
    <circle class="poi-dot" cx="260" cy="420" r="11"/><text class="poi-num" x="260" y="424">4</text>
    <text class="poi-label" x="276" y="414">Chez Rémy</text>
  </g>
  <g>
    <circle class="poi-dot" cx="200" cy="480" r="11"/><text class="poi-num" x="200" y="484">5</text>
    <text class="poi-label" x="90" y="500">PYM Kitchen</text>
  </g>
  <g>
    <circle class="poi-dot" cx="380" cy="500" r="11" fill="#6b5b95"/>
    <text class="poi-label" x="396" y="504">Cars Road Trip</text>
  </g>
  <g>
    <circle class="poi-dot" cx="470" cy="200" r="11" fill="#6b5b95"/>
    <text class="poi-label" x="486" y="204">Avengers Campus</text>
  </g>
  <g>
    <circle class="poi-dot" cx="330" cy="290" r="9" fill="#2f6b4f"/>
    <text class="poi-label" x="346" y="293" font-size="11">Baby Care Center</text>
  </g>

  <text x="20" y="600" font-size="11" fill="#6b7280">Ruta recomanada del matí (dilluns): línia daurada de punts 1→2→3→4→5</text>
</svg>
