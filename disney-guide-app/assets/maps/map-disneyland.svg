<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" font-family="'Inter','Work Sans',Arial,sans-serif">
  <defs>
    <style>
      .land { stroke: #1a2744; stroke-width: 1.5; stroke-dasharray: 3 5; }
      .land-label { font-size: 12px; fill: #6b7280; letter-spacing: 1px; text-transform: uppercase; }
      .route { stroke: #c9a227; stroke-width: 3; stroke-dasharray: 2 8; stroke-linecap: round; fill: none; }
      .poi-dot { fill: #1a2744; stroke: #f7f1e3; stroke-width: 2; }
      .poi-label { font-size: 12.5px; fill: #1a2744; font-weight: 600; }
      .poi-num { font-size: 11px; fill: #fff; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
  <rect width="620" height="620" fill="#f4ede0"/>

  <!-- Lands -->
  <ellipse class="land" cx="310" cy="230" rx="150" ry="130" fill="#f7ecd0"/>
  <text class="land-label" x="310" y="105" text-anchor="middle">Fantasyland</text>

  <ellipse class="land" cx="120" cy="330" rx="120" ry="110" fill="#e6e0cf"/>
  <text class="land-label" x="90" y="235" text-anchor="middle">Adventureland</text>

  <ellipse class="land" cx="310" cy="500" rx="220" ry="90" fill="#f0e6d2"/>
  <text class="land-label" x="310" y="575" text-anchor="middle">Main Street, U.S.A.</text>

  <!-- Route -->
  <path class="route" d="M310 500 L 310 420 L 260 330 L 340 260 L 400 210 L 300 190 L 195 265 L 150 340"/>

  <!-- Castle (glif simplificat) -->
  <g fill="#c9a227" stroke="#1a2744" stroke-width="2" stroke-linejoin="round">
    <rect x="285" y="150" width="50" height="40" fill="#f7ecd0"/>
    <polygon points="285,150 310,128 335,150"/>
    <rect x="265" y="160" width="24" height="30" fill="#f7ecd0"/>
    <polygon points="265,160 277,142 289,160"/>
    <rect x="331" y="160" width="24" height="30" fill="#f7ecd0"/>
    <polygon points="331,160 343,142 355,160"/>
  </g>
  <text x="310" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2744">El Castell</text>

  <!-- POIs -->
  <g>
    <circle class="poi-dot" cx="300" cy="190" r="11"/><text class="poi-num" x="300" y="194">1</text>
    <text class="poi-label" x="316" y="194">Peter Pan</text>
  </g>
  <g>
    <circle class="poi-dot" cx="195" cy="265" r="11"/><text class="poi-num" x="195" y="269">2</text>
    <text class="poi-label" x="211" y="269">It's a Small World</text>
  </g>
  <g>
    <circle class="poi-dot" cx="400" cy="210" r="11"/><text class="poi-num" x="400" y="214">3</text>
    <text class="poi-label" x="416" y="214">Dumbo</text>
  </g>
  <g>
    <circle class="poi-dot" cx="340" cy="260" r="11"/><text class="poi-num" x="340" y="264">4</text>
    <text class="poi-label" x="356" y="264">Carrousel</text>
  </g>
  <g>
    <circle class="poi-dot" cx="150" cy="340" r="11"/><text class="poi-num" x="150" y="344">5</text>
    <text class="poi-label" x="88" y="325">Agrabah Café</text>
  </g>
  <g>
    <circle class="poi-dot" cx="70" cy="400" r="11"/><text class="poi-num" x="70" y="404">6</text>
    <text class="poi-label" x="16" y="422">Captain Jack's</text>
  </g>
  <g>
    <circle class="poi-dot" cx="310" cy="420" r="11"/><text class="poi-num" x="310" y="424">7</text>
    <text class="poi-label" x="326" y="424">Plaza Gardens</text>
  </g>
  <g>
    <circle class="poi-dot" cx="310" cy="490" r="13" fill="#c9a227"/><text class="poi-num" x="310" y="494">★</text>
    <text class="poi-label" x="328" y="494">Gazebo · Punt de trobada</text>
  </g>
  <g>
    <circle class="poi-dot" cx="230" cy="510" r="9" fill="#2f6b4f"/>
    <text class="poi-label" x="246" y="513" font-size="11">Baby Care Center</text>
  </g>
  <g>
    <circle class="poi-dot" cx="400" cy="510" r="9" fill="#5b6b8c"/>
    <text class="poi-label" x="416" y="513" font-size="11">Lavabos</text>
  </g>

  <text x="20" y="600" font-size="11" fill="#6b7280">Ruta recomanada del matí (dimarts): línia daurada de punts 1→2→3→4→5</text>
</svg>
